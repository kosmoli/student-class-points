name: Manual Supabase database check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          : "${SUPABASE_URL:?Missing GitHub Actions secret SUPABASE_URL}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY}"

          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/classes?select=id&limit=1" >/dev/null

          echo "Supabase database was queried successfully."
