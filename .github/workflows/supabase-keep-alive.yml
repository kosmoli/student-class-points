name: Keep Supabase database awake

on:
  schedule:
    # GitHub Actions 使用日历式 cron；每月按 1、6、11、16、21、26、31 日运行
    - cron: "17 3 */5 * *"
  workflow_dispatch:

permissions: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          : "${SUPABASE_URL:?Missing GitHub Actions secret SUPABASE_URL}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY}"

          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/classes?select=id&limit=1" >/dev/null

          echo "Supabase database was queried successfully."
