<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e5e6f0" />
  <title>课堂积分</title>
  <style>
    :root { --bg:#e5e6f0; --surface:#fffdfd; --surface-2:#ffffff; --ink:#263657; --muted:#687590; --line:#c5deda; --primary:#6bcbd0; --primary-soft:#d5f1f0; --positive:#35a96c; --positive-soft:#dff5e9; --negative:#e66782; --negative-soft:#fde2eb; --gold:#d89b25; --pink:#ed78b5; --cyan:#61cfd4; --shadow:0 16px 40px rgba(70,91,135,.14); }
    * { box-sizing:border-box; } body { margin:0; background:linear-gradient(135deg,#e8e1ed 0%,#e3e9f1 45%,#d2f1ef 100%); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Microsoft YaHei",sans-serif; font-size:16px; }
    button,input,select { font:inherit; } button { cursor:pointer; border:0; } .hidden { display:none!important; }
    .auth-shell { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,#e8e1ed 0%,#e3e9f1 45%,#d2f1ef 100%); }
    .auth-card { width:min(440px,100%); background:var(--surface); padding:38px; border-radius:26px; box-shadow:var(--shadow); border:1px solid rgba(255,255,255,.85); }
    .brand-mark { width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),#c45cf0);color:#fff;font-size:25px;margin-bottom:20px; box-shadow:0 7px 18px rgba(242,123,181,.28); } h1,h2,h3,p { margin-top:0; } h1 { font-size:30px; letter-spacing:-.03em; margin-bottom:8px; } .sub { color:var(--muted); line-height:1.6; margin-bottom:26px; }
    label { display:block; color:var(--muted); font-size:14px; margin:15px 0 7px; } input,select { width:100%; min-height:44px; border:1px solid var(--line); border-radius:12px; padding:9px 12px; color:var(--ink); background:var(--surface-2); outline:none; } input:focus,select:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(101,207,212,.18); }
    .btn { min-height:42px; border-radius:11px; padding:9px 14px; color:var(--ink); background:#edf4f5; font-weight:650; transition:.15s ease; } .btn:hover { transform:translateY(-1px); filter:brightness(.98); } .btn.primary { background:var(--primary); color:#21405c; } .btn.ghost { background:transparent; color:#d15b9e; } .btn.small { min-height:34px; padding:6px 10px; font-size:14px; } .btn.positive { background:var(--positive-soft); color:var(--positive); } .btn.negative { background:var(--negative-soft); color:var(--negative); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .auth-actions { display:flex; align-items:center; justify-content:space-between; margin-top:20px; gap:12px; } .message { min-height:22px; color:var(--negative); font-size:14px; margin-top:12px; }
    .app-shell { min-height:100vh; } .topbar { height:74px; padding:0 30px; display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,.88); border-bottom:1px solid rgba(197,222,218,.85); position:sticky; top:0; z-index:10; backdrop-filter:blur(12px); } .topbar-left { display:flex; align-items:center; gap:14px; } .mini-mark { width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pink),#d968b4);color:#fff;display:grid;place-items:center;font-size:18px; } .topbar-title { font-weight:750; font-size:18px; } .topbar-user { color:var(--muted); font-size:14px; display:flex; align-items:center; gap:12px; }
    .page { max-width:1440px; margin:0 auto; padding:28px 30px 48px; } .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:22px; } .page-head h1 { font-size:28px; margin:0 0 6px; } .page-head p { color:var(--muted); margin:0; } .head-actions { display:flex; gap:10px; align-items:center; }
    .tabs { display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:22px; overflow:auto; } .tab { padding:11px 14px; color:var(--muted); background:transparent; white-space:nowrap; border-bottom:2px solid transparent; } .tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:700; }
    .grid { display:grid; gap:18px; } .grid.stats { grid-template-columns:repeat(4,1fr); } .grid.two { grid-template-columns:1.35fr 1fr; } .card { background:var(--surface); border:1px solid rgba(197,222,218,.9); border-radius:18px; padding:20px; box-shadow:0 5px 18px rgba(70,91,135,.09); } .card h2 { font-size:17px; margin-bottom:16px; } .metric .label { color:var(--muted); font-size:14px; } .metric .value { font-size:30px; font-weight:800; margin-top:7px; } .metric .hint { color:var(--muted); font-size:13px; margin-top:3px; }
    .student-toolbar,.record-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; } .student-toolbar input { width:220px; } .check-all { display:flex; align-items:center; justify-content:flex-start; gap:7px; width:auto; min-width:180px; margin:0; color:var(--muted); font-size:14px; white-space:nowrap; } input[type=checkbox] { width:18px; min-width:18px; min-height:18px; accent-color:var(--primary); }
    .student-list { display:flex; flex-direction:column; gap:9px; } .student-row { display:grid; grid-template-columns:30px minmax(150px,1fr) 90px 150px minmax(180px,1.4fr); gap:10px; align-items:center; padding:12px 10px; border:1px solid var(--line); border-radius:14px; } .student-row:hover { background:#f5fbfb; } .student-name { font-weight:700; } .group-name { color:var(--muted); font-size:14px; } .score { font-weight:800; font-size:19px; text-align:center; } .positive-score { color:var(--positive); } .negative-score { color:var(--negative); } .rule-buttons { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; } .rule-btn { border-radius:9px; padding:7px 9px; font-size:13px; font-weight:700; background:var(--positive-soft); color:var(--positive); } .rule-btn.neg { background:var(--negative-soft); color:var(--negative); } .student-pagination { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px; color:var(--muted); font-size:14px; } .student-pagination .btn { min-width:74px; } .student-pagination .btn:disabled { cursor:not-allowed; opacity:.45; transform:none; } .student-group-filter { width:150px; }
    .rank-list { display:flex; flex-direction:column; gap:8px; } .rank-row { display:grid; grid-template-columns:40px 1fr auto; align-items:center; gap:10px; padding:10px 12px; background:#f5fbfb; border-radius:12px; } .rank-no { font-size:23px; text-align:center; } .rank-name { font-weight:700; } .rank-meta { color:var(--muted); font-size:13px; } .rank-score { font-size:18px; font-weight:800; } .rank-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:16px; } .rank-head h2 { margin-bottom:5px; } .rank-period { width:150px; } .rank-note { color:var(--muted); font-size:13px; line-height:1.5; } .flower { color:var(--pink); margin-right:8px; text-shadow:0 0 14px rgba(242,123,181,.35); }
    .table-wrap { overflow:auto; } table { width:100%; border-collapse:collapse; } th,td { padding:12px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; } th { color:var(--muted); font-size:13px; font-weight:650; } td { font-size:14px; } .record-toolbar select { width:160px; } .points.pos { color:var(--positive); font-weight:800; } .points.neg { color:var(--negative); font-weight:800; } .empty { color:var(--muted); text-align:center; padding:30px 10px; }
    .settings-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; } .item-list { display:flex; flex-direction:column; gap:8px; margin-top:14px; } .item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; background:#f5fbfb; border-radius:11px; } .item small { color:var(--muted); } .item-actions { display:flex; align-items:center; justify-content:flex-end; gap:7px; flex-wrap:wrap; } .item-actions select { width:auto; min-width:120px; } .inline-form { display:flex; gap:8px; flex-wrap:wrap; } .inline-form input { min-width:0; flex:1; } .import-note { color:var(--muted); font-size:13px; line-height:1.45; margin:9px 0 0; } .btn.danger { background:var(--negative-soft); color:var(--negative); } .notice { background:#fff6e9; border:1px solid #f0d7ac; color:#806022; border-radius:12px; padding:12px 14px; line-height:1.55; font-size:14px; margin-bottom:18px; }
    .batch-bar { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:25; width:min(720px,calc(100% - 24px)); display:flex; align-items:center; gap:10px; padding:12px 14px; background:rgba(255,255,255,.96); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 32px rgba(38,54,87,.2); } .batch-bar strong { white-space:nowrap; } .batch-bar select { flex:1; min-width:160px; } .batch-bar .btn { white-space:nowrap; } .modal-backdrop { position:fixed; inset:0; background:rgba(38,54,87,.35); display:grid; place-items:center; z-index:20; padding:18px; } .modal { width:min(520px,100%); background:var(--surface); border-radius:20px; padding:24px; box-shadow:var(--shadow); } .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; } .modal-head h2 { margin:0; } .modal-close { background:transparent; font-size:24px; color:var(--muted); }
    .toast { position:fixed; right:22px; bottom:22px; z-index:30; background:#263657; color:#fff; padding:12px 16px; border-radius:12px; box-shadow:var(--shadow); } .loading { position:fixed; inset:0; background:rgba(229,230,240,.78); display:grid; place-items:center; z-index:40; color:#5b4fc4; font-weight:700; }
    @media (max-width:1050px) { .grid.stats { grid-template-columns:repeat(2,1fr); } .grid.two { grid-template-columns:1fr; } .settings-grid { grid-template-columns:1fr; } .student-row { grid-template-columns:28px 1fr 75px; } .student-row .group-name,.student-row .rule-buttons { grid-column:2 / -1; } .student-row .rule-buttons { justify-content:flex-start; } }
    @media (max-width:650px) { .topbar { padding:0 16px; } .topbar-user span { display:none; } .page { padding:20px 14px 36px; } .page-head { flex-direction:column; } .head-actions { width:100%; } .head-actions select { flex:1; } .grid.stats { gap:10px; } .card { padding:15px; } .metric .value { font-size:25px; } .student-toolbar input { width:100%; } .student-toolbar input[type=checkbox] { width:18px; min-width:18px; } .student-toolbar { display:grid; grid-template-columns:1fr 1fr; align-items:center; } .student-toolbar input,.student-toolbar .check-all,.student-toolbar .student-group-filter,.student-toolbar select,.student-toolbar button { grid-column:1 / -1; width:100%; } .student-toolbar .check-all { display:flex; min-width:0; min-height:44px; padding:6px 0; margin:0; white-space:nowrap; } .student-row { grid-template-columns:28px 1fr 75px; } .student-pagination { justify-content:space-between; } .batch-bar { flex-wrap:wrap; bottom:10px; } .batch-bar strong { width:100%; } .batch-bar select,.batch-bar .btn { flex:1; min-width:0; } .record-toolbar select { width:100%; } .rank-head { flex-direction:column; } .rank-period,.rank-head .btn { width:100%; } .auth-card { padding:28px 22px; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading" class="loading hidden">正在加载…</div>
  <div id="toast" class="toast hidden"></div>
  <script>
    const SUPABASE_URL = "https://ggnmqjwpvykvgwdgandy.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qvICNrhEtJTfeQAMdrNrmA_LBAb5BOU";
    const API = SUPABASE_URL + "/rest/v1/";
    const AUTH = SUPABASE_URL + "/auth/v1/";
    const state = { session:null, user:null, classData:null, groups:[], students:[], rules:[], records:[], tab:"home", search:"", groupFilter:"all", studentPage:1, studentPageSize:20, selected:new Set(), recordFilter:"all", recordStudent:"all", rankPeriod:"all", exportPeriod:"all" };
    const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const fmt = n => Number(n||0) > 0 ? "+"+n : String(n||0);
    const medal = i => i===0 ? "🥇" : i===1 ? "🥈" : i===2 ? "🥉" : String(i+1);
    const scoreFor = (id, records=state.records) => records.filter(r=>r.student_id===id && !r.reversed_at).reduce((a,r)=>a+Number(r.points),0);
    const groupScore = (id, records=state.records) => state.students.filter(s=>s.group_id===id).reduce((a,s)=>a+scoreFor(s.id,records),0);
    function lanternFestival(year){ try{ const fmt=new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric'}); for(let d=new Date(year,0,1);d<new Date(year,4,1);d.setDate(d.getDate()+1)){ const parts=fmt.formatToParts(d),month=Number(parts.find(p=>p.type==='month')?.value),day=Number(parts.find(p=>p.type==='day')?.value); if(month===1&&day===15)return new Date(d); } }catch{} return new Date(year,1,15); }
    function dayAfter(d){ const next=new Date(d); next.setDate(next.getDate()+1); next.setHours(0,0,0,0); return next; }
    function semesterRange(){ const now=new Date(); now.setHours(0,0,0,0); const year=now.getFullYear(), sep=new Date(year,8,1), spring=dayAfter(lanternFestival(year)); let start,end,label; if(now>=sep){ start=sep; end=dayAfter(lanternFestival(year+1)); label=`${year}—${year+1}年秋季学期`; } else if(now>=spring){ start=spring; end=sep; label=`${year}年春季学期`; } else { start=new Date(year-1,8,1); end=spring; label=`${year-1}—${year}年秋季学期`; } const date=d=>d.toLocaleDateString('zh-CN',{year:'numeric',month:'numeric',day:'numeric'}); return {start,end,label:`${label}（${date(start)}—${date(new Date(end.getTime()-86400000))}）`}; }
    function rankRange(period){ if(period==='all') return null; if(period==='semester') return semesterRange(); const now=new Date(), start=new Date(now); start.setHours(0,0,0,0); if(period==='week'){ const day=start.getDay(); start.setDate(start.getDate()+(day===0?-6:1-day)); } else start.setDate(1); const end=new Date(start); if(period==='week') end.setDate(end.getDate()+7); else end.setMonth(end.getMonth()+1); const last=new Date(end); last.setDate(last.getDate()-1); const date=d=>d.toLocaleDateString('zh-CN',{year:'numeric',month:'numeric',day:'numeric'}); return {start,end,label:date(start)+'—'+date(last)}; }
    function recordsForPeriod(period){ const range=rankRange(period); return state.records.filter(r=>{ if(r.reversed_at)return false; if(!range)return true; const t=new Date(r.created_at); return t>=range.start&&t<range.end; }); }
    function setLoading(v){ document.getElementById("loading").classList.toggle("hidden",!v); }
    function toast(msg){ const e=document.getElementById("toast"); e.textContent=msg; e.classList.remove("hidden"); setTimeout(()=>e.classList.add("hidden"),2400); }
    async function api(path, opts={}){
      const h={apikey:SUPABASE_PUBLISHABLE_KEY, Authorization:"Bearer "+(state.session?.access_token||SUPABASE_PUBLISHABLE_KEY), "Content-Type":"application/json", Prefer: opts.method==="POST"?"return=representation":"return=minimal", ...(opts.headers||{})};
      const res=await fetch(API+path,{...opts,headers:h}); const text=await res.text(); let data=null; try{data=text?JSON.parse(text):null}catch{}
      if(!res.ok){ const error=new Error(data?.message||data?.hint||data?.error_description||text||res.statusText); error.status=res.status; throw error; } return data;
    }
    async function auth(path, body){ const res=await fetch(AUTH+path,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)}); const d=await res.json(); if(!res.ok) throw new Error(d.error_description||d.msg||d.message||"登录失败"); return d; }
    function render(){ state.session&&state.classData?.id ? renderApp() : renderAuth(); }
    function renderAuth(){ document.getElementById("app").innerHTML=`<main class="auth-shell"><section class="auth-card"><div class="brand-mark">✿</div><h1>课堂积分</h1><p class="sub">记录每一次表现，自动汇总个人与小组成绩。</p><form id="authForm"><label>邮箱</label><input id="email" type="email" required placeholder="teacher@example.com"><label>密码</label><input id="password" type="password" required minlength="6" placeholder="至少 6 位"><div class="message" id="authMsg"></div><div class="auth-actions"><button class="btn ghost" type="button" id="signupBtn">创建账号</button><button class="btn primary" type="submit">登录</button></div></form></section></main>`; document.getElementById("authForm").onsubmit=login; document.getElementById("signupBtn").onclick=signup; }
    async function login(e){ e.preventDefault(); const msg=document.getElementById("authMsg"); msg.textContent=""; try{setLoading(true); const d=await auth("token?grant_type=password",{email:email.value,password:password.value}); state.session=d; state.user=d.user; localStorage.setItem("class_points_session",JSON.stringify(d)); await loadData(); render();}catch(x){msg.textContent=x.message;}finally{setLoading(false);} }
    async function signup(){ const msg=document.getElementById("authMsg"); try{setLoading(true); const redirect=window.location.origin; const d=await auth("signup?redirect_to="+encodeURIComponent(redirect),{email:email.value,password:password.value}); if(d.access_token){state.session=d;state.user=d.user;localStorage.setItem("class_points_session",JSON.stringify(d));await loadData();render();}else msg.textContent="账号已创建，请先完成邮箱验证后再登录。";}catch(x){msg.textContent=x.message;}finally{setLoading(false);} }
    async function logout(){ localStorage.removeItem("class_points_session"); state.session=null;state.user=null;state.classData=null;render(); }
    async function loadData(){ const hadClass=Boolean(state.classData?.id); setLoading(true); try{ let cs=await api("classes?select=*&order=created_at.asc"); if(!cs.length) { const made=await api("classes",{method:"POST",body:JSON.stringify({owner_id:state.user.id,name:"我的班级"})}); cs=made; } if(!cs?.[0]?.id) throw new Error("未找到班级数据，请重新登录"); state.classData=cs[0]; const cid=state.classData.id; [state.groups,state.students,state.rules,state.records]=await Promise.all([api(`groups?class_id=eq.${cid}&select=*&order=created_at.asc`),api(`students?class_id=eq.${cid}&select=*&active=eq.true&order=created_at.asc`),api(`scoring_rules?class_id=eq.${cid}&select=*&active=eq.true&order=created_at.asc`),api(`score_records?class_id=eq.${cid}&select=*&order=created_at.desc`)]); } catch(e){ if(!hadClass)state.classData=null; throw e; } finally{setLoading(false);} }
    function ensureClass(){ if(!state.classData?.id){toast("班级数据尚未加载，请刷新页面或重新登录");return false;} return true; }
    function renderApp(){ const nav=[['home','记分台'],['rank','排行榜'],['records','积分记录'],['settings','设置']]; document.getElementById("app").innerHTML=`<div class="app-shell"><header class="topbar"><div class="topbar-left"><div class="mini-mark">✿</div><div class="topbar-title">课堂积分</div></div><div class="topbar-user"><span>${esc(state.user?.email||"")}</span><button class="btn small" id="logoutBtn">退出</button></div></header><main class="page"><div class="page-head"><div><h1><span class="flower">✿</span>${esc(state.classData?.name||"我的班级")}</h1><p>把课堂表现变成清晰、即时、可追溯的积分。</p></div><div class="head-actions"><select id="classSelect"><option>${esc(state.classData?.name||"我的班级")}</option></select><button class="btn primary" id="refreshBtn">刷新数据</button></div></div><nav class="tabs">${nav.map(([id,t])=>`<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${t}</button>`).join("")}</nav><section id="view"></section></main></div>`; document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderApp()}); document.getElementById("logoutBtn").onclick=logout; document.getElementById("refreshBtn").onclick=async()=>{try{await loadData();renderApp();}catch(e){toast("数据加载失败："+e.message);if(e.status===401)logout();}}; const v=document.getElementById("view"); if(state.tab==='home') v.innerHTML=homeView(); if(state.tab==='rank') v.innerHTML=rankView(); if(state.tab==='records') v.innerHTML=recordsView(); if(state.tab==='settings') v.innerHTML=settingsView(); bindView(); }
    function homeView(){ const total=state.students.length, points=state.records.filter(r=>!r.reversed_at).reduce((a,r)=>a+Number(r.points),0), recent=state.records.filter(r=>!r.reversed_at).slice(0,5); return `<div class="grid stats"><div class="card metric"><div class="label">学生人数</div><div class="value">${total}</div><div class="hint">当前班级</div></div><div class="card metric"><div class="label">小组数量</div><div class="value">${state.groups.length}</div><div class="hint">可随时调整成员</div></div><div class="card metric"><div class="label">积分规则</div><div class="value">${state.rules.length}</div><div class="hint">加分与减分</div></div><div class="card metric"><div class="label">当前总积分</div><div class="value">${fmt(points)}</div><div class="hint">所有有效记录合计</div></div></div><div class="grid two" style="margin-top:18px"><div class="card"><h2>快速记分</h2><div class="student-toolbar"><input id="studentSearch" placeholder="搜索学生姓名" value="${esc(state.search)}"><label class="check-all"><input type="checkbox" id="selectAll" ${allCurrentStudentsSelected()?'checked':''}> 全选当前学生</label><select id="batchRule"><option value="">批量加分规则…</option>${state.rules.map(r=>`<option value="${r.id}">${esc(r.name)}（${fmt(r.points)}）</option>`).join("")}</select><button class="btn primary" id="batchBtn">批量应用</button></div><div class="student-list">${studentRows()}</div></div><div class="card"><h2>最近记录</h2>${recent.length?`<div class="rank-list">${recent.map(r=>{const s=state.students.find(x=>x.id===r.student_id);return `<div class="rank-row"><div class="rank-no">${Number(r.points)>0?'＋':'－'}</div><div><div class="rank-name">${esc(s?.name||'已删除学生')}</div><div class="rank-meta">${esc(r.rule_name_snapshot)} · ${new Date(r.created_at).toLocaleString()}</div></div><div class="rank-score ${Number(r.points)>0?'points pos':'points neg'}">${fmt(r.points)}</div></div>`}).join("")}</div>`:'<div class="empty">还没有积分记录</div>'}<button class="btn ghost" id="allRecordsBtn" style="margin-top:12px">查看全部记录 →</button></div></div>`; }
    function filteredStudents(){ const q=state.search.trim().toLowerCase(); return state.students.filter(s=>(state.groupFilter==='all'||s.group_id===state.groupFilter)&&s.name.toLowerCase().includes(q)); }
    function currentStudents(){ return filteredStudents(); }

    function firstColumnFromDelimited(text){ const values=[];let field='',inQuotes=false,done=false;const push=()=>{values.push(field.trim());field='';inQuotes=false;done=false;};for(let i=0;i<text.length;i++){const ch=text[i];if(!inQuotes&&ch==='\n'){push();continue;}if(done)continue;if(ch==='"'){if(inQuotes&&text[i+1]==='"'){field+='"';i++;}else inQuotes=!inQuotes;}else if(!inQuotes&&(ch===','||ch==='\t')){done=true;}else if(ch!=='\r'){field+=ch;}}if(field||text.endsWith('\n')===false)push();return values; }
    function normalizeImportedNames(names){ const seen=new Set(state.students.map(s=>s.name.trim().toLocaleLowerCase()));const result=[];names.forEach((raw,index)=>{const name=String(raw??'').trim();if(!name)return;if(index===0&&/^(姓名|学生姓名|name|student|student name)$/i.test(name))return;const key=name.toLocaleLowerCase();if(seen.has(key))return;seen.add(key);result.push(name);});return result; }
    async function importStudents(e){ if(!ensureClass())return;const input=e.target,file=input.files?.[0];input.value='';if(!file)return;try{setLoading(true);let names;const lower=file.name.toLowerCase();if(lower.endsWith('.xlsx')||lower.endsWith('.xls')){const XLSX=await loadXlsx(),book=XLSX.read(await file.arrayBuffer(),{type:'array'}),sheet=book.Sheets[book.SheetNames[0]];names=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''}).map(row=>row?.[0]);}else names=firstColumnFromDelimited(await file.text());const imported=normalizeImportedNames(names);if(!imported.length){toast('没有可添加的新学生');return;}await api('students',{method:'POST',body:JSON.stringify(imported.map(name=>({class_id:state.classData.id,name})))});await loadData();renderApp();toast(`已批量添加 ${imported.length} 名学生`);}catch(e){toast('批量导入失败：'+e.message)}finally{setLoading(false)} }
    async function deleteStudent(id){ if(!ensureClass())return;const student=state.students.find(s=>s.id===id);if(!student||!confirm(`确定删除学生“${student.name}”吗？历史积分记录会保留。`))return;try{setLoading(true);await api('students?id=eq.'+id,{method:'PATCH',body:JSON.stringify({active:false,group_id:null})});state.selected.delete(id);await loadData();renderApp();toast('学生已删除，历史积分记录已保留');}catch(e){toast('删除学生失败：'+e.message)}finally{setLoading(false)} }
    async function addGroup(){ if(!ensureClass())return; const name=document.getElementById('newGroup').value.trim();if(!name)return;try{setLoading(true);await api('groups',{method:'POST',body:JSON.stringify({class_id:state.classData.id,name})});await loadData();renderApp();}catch(e){toast('添加小组失败：'+e.message)}finally{setLoading(false)} }
    async function deleteGroup(id){ if(!ensureClass())return;const group=state.groups.find(g=>g.id===id);if(!group||!confirm(`确定删除小组“${group.name}”吗？成员会变为未分组，历史积分记录会保留。`))return;try{setLoading(true);await api('groups?id=eq.'+id,{method:'DELETE'});await loadData();renderApp();toast('小组已删除');}catch(e){toast('删除小组失败：'+e.message)}finally{setLoading(false)} }
    async function addRule(){ if(!ensureClass())return; const name=document.getElementById('newRule').value.trim(),points=Number(document.getElementById('newPoints').value);if(!name||!points){toast('请输入项目名称和非零分值');return;}try{setLoading(true);await api('scoring_rules',{method:'POST',body:JSON.stringify({class_id:state.classData.id,name,points})});await loadData();renderApp();}catch(e){toast('添加规则失败：'+e.message)}finally{setLoading(false)} }
    async function deleteRule(id){ if(!ensureClass())return;const rule=state.rules.find(r=>r.id===id);if(!rule||!confirm(`确定删除积分规则“${rule.name}”吗？历史积分记录会保留。`))return;try{setLoading(true);await api('scoring_rules?id=eq.'+id,{method:'PATCH',body:JSON.stringify({active:false})});await loadData();renderApp();toast('积分规则已删除，历史记录已保留');}catch(e){toast('删除积分规则失败：'+e.message)}finally{setLoading(false)} }
    async function changeGroup(student_id,group_id){try{await api('students?id=eq.'+student_id,{method:'PATCH',body:JSON.stringify({group_id:group_id||null})});const s=state.students.find(x=>x.id===student_id);if(s)s.group_id=group_id||null;toast('分组已更新');}catch(e){toast(e.message)} }
    (async function init(){ try{const saved=localStorage.getItem('class_points_session');if(saved){state.session=JSON.parse(saved);state.user=state.session.user;await loadData();}}catch{localStorage.removeItem('class_points_session');state.session=null;state.user=null;state.classData=null;} render(); })();
    function settingsStudentPageCount(){ return Math.max(1,Math.ceil(state.students.length/state.studentPageSize)); }
    function settingsStudentRows(){ const total=state.students.length,pages=settingsStudentPageCount(); state.settingsStudentPage=Math.min(Math.max(1,state.settingsStudentPage||1),pages); const start=(state.settingsStudentPage-1)*state.studentPageSize; const list=state.students.slice(start,start+state.studentPageSize); if(!total)return '<div class="empty">还没有学生</div>'; return list.map(s=>`<div class="item"><span>${esc(s.name)}</span><div class="item-actions"><select data-student-group="${s.id}"><option value="">未分组</option>${state.groups.map(g=>`<option value="${g.id}" ${s.group_id===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><button class="btn small danger" data-delete-student="${s.id}" type="button">删除</button></div></div>`).join('')+(pages>1?`<div class="student-pagination"><button class="btn small" data-settings-student-page="${Math.max(1,state.settingsStudentPage-1)}" ${state.settingsStudentPage<=1?'disabled':''}>上一页</button><span>第 ${state.settingsStudentPage} / ${pages} 页，共 ${total} 人</span><button class="btn small" data-settings-student-page="${Math.min(pages,state.settingsStudentPage+1)}" ${state.settingsStudentPage>=pages?'disabled':''}>下一页</button></div>`:''); }
    function renderSettingsStudents(){ const list=document.querySelector('.settings-grid .card:first-child .item-list'); if(list)list.innerHTML=settingsStudentRows(); }
    function bindSettingsStudentControls(){ document.querySelectorAll('[data-settings-student-page]').forEach(b=>b.onclick=()=>{state.settingsStudentPage=Number(b.dataset.settingsStudentPage);renderSettingsStudents();bindSettingsStudentControls();}); document.querySelectorAll('[data-delete-student]').forEach(b=>b.onclick=()=>deleteStudent(b.dataset.deleteStudent)); document.querySelectorAll('[data-student-group]').forEach(s=>s.onchange=()=>changeGroup(s.dataset.studentGroup,s.value)); }
    const baseBindView = bindView;
    bindView = function(){ baseBindView(); if(state.tab==='settings'){ renderSettingsStudents(); bindSettingsStudentControls(); } };
  </script>
</body>
